name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Licences
        run: make licences

  infra:
    # Synthesizes every stack and runs the guardrail tests. No AWS credentials involved.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install CDK
        run: |
          npm install -g aws-cdk
          python -m pip install -r infra/requirements-dev.txt
      - name: Synth
        working-directory: infra
        run: cdk synth -c stage=ci --quiet
      - name: Guardrail tests
        working-directory: infra
        run: python -m pytest -q tests
