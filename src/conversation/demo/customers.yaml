# DEMO CUSTOMERS. EVERYTHING IN THIS FILE IS SYNTHETIC.
# Invented people (first name only), products, cards, transactions, fees and contacts for the
# judge-mode demo. No document numbers, addresses or phone numbers, ever. Not derived from
# any real customer. Read by src/conversation/demo_gateway.py (owner: arturo; proposal to
# Andrés as the `demo` backend of INTERFACES.md #2).
#
# Data is frozen at 2026-06-17 (dataset cut-off). Relative dates said by a customer ("el 12")
# resolve against the customer's reference date = their latest transaction on or before
# data_cutoff (computed by the gateway).
#
# Each customer has explicit `transactions` (the scenario) plus a `background` block that the
# gateway expands into ordinary purchases with random.Random(seed): same file, same output.
# Background purchases never land within +-15% of a scenario amount within 3 days of it, so
# they cannot change which charge the demo is about.
#
# joao: country AR and currency ARS are an ASSUMPTION by Arturo (Diego reviews it).
# Portuguese names and texts are generated, without native review.

