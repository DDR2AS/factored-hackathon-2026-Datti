  status.investigating: "em investigação"
  status.awaiting_analyst: "em revisão"
  status.notified: "notificado"
  status.closed: "fechado"
  status.reopened: "reaberto"
  status.resolved_in_contact: "resolvido na conversa"
  status.handed_off: "encaminhado para uma pessoa"

  # ---------------------------------------------------------------- review fixes (2026-09-28)
  confirm_charge_uncertain: "Encontrei esta cobrança parecida, embora não corresponda totalmente ao que você me disse: {charge}. É esta?"
  confirm_charge_other_merchant: "Não encontrei uma cobrança nesse estabelecimento. A mais parecida nos seus movimentos é esta, em outro estabelecimento: {charge}. É esta?"
  lane_b_case_open_other: "Abri o caso {case_id}. Uma pessoa da equipe vai analisá-lo e te dar uma primeira resposta até {first_response_by}. Data estimada de resolução: {expected_date}."
  case_note_added: "Adicionei isso ao seu caso {case_id}, então a pessoa que o atender vai ver. Você não precisa repetir."
  other_charge_after_case: "Isso parece outra reclamação, diferente do caso {case_id}, e não misturei com esse caso. Se quiser, eu te encaminho para uma pessoa para analisá-la."
  side_request_noted: "Anotei no caso {case_id} que você quer falar com uma pessoa sobre essa outra solicitação; a pessoa que analisar o caso vai ver. Sua reclamação continua igual."
  block_use_button: "Para bloquear o cartão, preciso que você confirme pelo botão; uma mensagem escrita não o bloqueia."
  block_unavailable: "Sinto muito pelo seu cartão. Agora não consegui consultar seus cartões, então não o bloqueei: a pessoa que assumir o seu caso vai fazer isso com você."
  lost_card_noted: "Anotei o que aconteceu com seu cartão no caso {case_id}; a pessoa que o atender vai ver."

  # ---------------------------------------------------------------- console and switches (2026-09-29)
  resolution_stamp: "Resposta aprovada por uma pessoa da equipe. Nesta demonstração nenhum dinheiro é movimentado."
  request_information_default: "Para avançar com o seu caso {case_id} precisamos de mais uma informação. Responda por este chat e nós a adicionamos ao seu caso."
  case_info_added: "Obrigado. Adicionei sua resposta ao caso {case_id} e uma pessoa da equipe vai analisá-la. Vamos te escrever por este canal."
  case_reopened: "Entendido. Reabri o seu caso {case_id} para que uma pessoa da equipe revise a resposta de novo, com prioridade. Vamos te escrever por este canal."
  case_awaiting_answer: "Estamos esperando sua resposta à pergunta da equipe: escreva aqui e eu adiciono ao caso."
  switch.tools_down_on: "Modo juiz: ferramentas de dados fora do ar nesta sessão (simulado)."
  switch.tools_down_off: "Modo juiz: ferramentas de dados restabelecidas nesta sessão."
  switch.model_slow_on: "Modo juiz: modelo lento nesta sessão (simulado); os modelos de texto respondem."
  switch.model_slow_off: "Modo juiz: modelo restabelecido nesta sessão."
  switch.fast_clock_on: "Modo juiz: relógio acelerado para os casos desta sessão (simulado: 1 dia = {day}). As datas prometidas não mudam."
  switch.fast_clock_on_neutral: "Modo juiz: relógio acelerado para os casos desta sessão (simulado). As datas prometidas não mudam."
  switch.fast_clock_off: "Modo juiz: relógio real para os casos desta sessão."
  # See es.yaml: proactive notices of the SLA timers; they repeat the promised date only.
  sla_notice.sla_80: "Seguimos trabalhando no seu caso {case_id}. Ainda não temos uma resposta final; a data estimada continua sendo {expected_date} e vamos te escrever por este canal assim que houver novidades."
  sla_notice.escalated: "O seu caso {case_id} está levando mais tempo do que o previsto, então o passamos para uma equipe sênior com prioridade alta. A data estimada continua sendo {expected_date}; vamos te escrever por este canal."
  sla_notice.sla_80_date_passed: "Seguimos trabalhando no seu caso {case_id}. A data estimada que informamos já passou e ainda não temos uma resposta final; vamos te escrever por este canal assim que houver novidades."
  sla_notice.escalated_date_passed: "O seu caso {case_id} está levando mais tempo do que o previsto, então o passamos para uma equipe sênior com prioridade alta. A data estimada que informamos já passou; vamos te escrever por este canal assim que houver novidades."

  # ---------------------------------------------------------------- console backend (30 sep)
  # See es.yaml: drafts of the PROVISIONAL deterministic investigator; never a promise of money.
  resolution_intro: "Novidades do seu caso {case_id}:"
  investigator.no_date: "a data estimada do caso"
  investigator.draft.duplicate_not_reversed: "Revisamos o seu caso {case_id}: há duas cobranças iguais de {amount} em {merchant} em {date}, com minutos de diferença, e nenhuma tem estorno registrado. O passo proposto é abrir uma disputa com o estabelecimento pela cobrança repetida. Avisaremos o resultado até {expected_date}."
  investigator.draft.fee_off_schedule: "Revisamos o seu caso {case_id}: a tarifa «{fee_name}» de {date} foi cobrada por {amount} e a tarifa vigente do seu produto é {fee_amount}. O passo proposto é corrigir a tarifa conforme a tabela vigente. Avisaremos o resultado até {expected_date}."
  investigator.draft.purchase_amount_disputed: "Revisamos o seu caso {case_id}: a cobrança de {merchant} em {date} está registrada por {amount}. Para seguir, precisamos do comprovante da compra ou do valor que você esperava pagar; você pode enviar respondendo por este canal."
  investigator.draft.unrecognized_new_merchant: "Revisamos o seu caso {case_id}: a cobrança de {amount} em {merchant} em {date} é a primeira nesse estabelecimento nos últimos 90 dias. O passo proposto é abrir uma disputa com o estabelecimento por essa cobrança. Avisaremos o resultado até {expected_date}."
  investigator.draft.unrecognized_known_merchant: "Revisamos o seu caso {case_id}: a cobrança de {amount} em {merchant} em {date} é parecida com compras anteriores suas nesse estabelecimento. Para seguir, precisamos saber se outra pessoa usa o seu cartão ou se você tem o comprovante; você pode responder por este canal."
  investigator.draft.explained: "Revisamos o seu caso {case_id} sobre a cobrança de {amount} em {merchant} em {date}, e o registro explica a cobrança. Se algo não fizer sentido, responda por este canal e uma pessoa revisa de novo."
  investigator.draft.generic: "Revisamos o seu caso {case_id}. Uma pessoa da equipe continua a revisão e avisaremos o resultado até {expected_date}."
