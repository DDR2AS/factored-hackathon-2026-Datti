# System texts in Brazilian Portuguese (owner: arturo). Rendered by src/conversation/templates.py.
# GENERATED PORTUGUESE, WITHOUT NATIVE REVIEW. One register (você) for every country.
# Same keys and variables as es.yaml (tests/test_templates.py). No text promises a refund or
# compensation, or says the money will come back.
# The demo conversation texts are SYNTHETIC; nothing here refers to a real customer.

language: pt
registers: {}
default_register: voce

texts:
  # ---------------------------------------------------------------- start
  welcome: "Olá, {name}. Sou o assistente de reclamações do LATAM Bank (demo com dados sintéticos). Posso verificar uma cobrança, uma tarifa ou o andamento do seu caso. O que aconteceu?"
  clarify_intent: "Pode me contar o que aconteceu? Por exemplo: «não reconheço uma cobrança de 450 do dia 12»."
  not_understood: "Não entendi bem. Pode me contar com outras palavras ou escolher uma opção?"
  ask_language: "Continuamos em português ou em espanhol? / ¿Seguimos en español o en portugués?"

  # ---------------------------------------------------------------- find the charge
  ask_amount: "Você lembra o valor aproximado da cobrança?"
  ask_date: "Em que dia foi a cobrança, mais ou menos?"
  ask_merchant: "Você lembra em qual estabelecimento foi?"
  ask_more_detail: "Não encontrei uma cobrança que corresponda com segurança. Pode me dar outro dado: o valor aproximado, a data ou o estabelecimento?"
  charge_line: "{date} · {merchant} · {amount} · •••• {last4}"
  confirm_charge: "Encontrei esta cobrança nos seus movimentos: {charge}. É esta?"
  choose_charge: "Encontrei {n} cobranças parecidas. Qual é?"
  none_of_these: "Entendi, não é nenhuma dessas. Pode me dar outro dado da cobrança: valor, data ou estabelecimento?"
  no_charge_found: "Não encontrei essa cobrança nos seus movimentos. Quer revisar os dados ou falar com uma pessoa?"
  ask_recognize: "Você reconhece esta cobrança?"

  # ---------------------------------------------------------------- lane A: explained with the record
  lane_a_recognized: "Obrigado por verificar. Como você reconhece a cobrança, não é preciso abrir um caso. Se notar algo estranho depois, é só me escrever de novo."
  lane_a_already_reversed: "Verifiquei o registro: esta cobrança já tem um estorno aplicado em {reversal_date} no valor de {amount}. Não é preciso abrir um caso."
  lane_a_duplicate_reversed: "Verifiquei o registro: a cobrança repetida já tem um estorno aplicado em {reversal_date}. Não é preciso abrir um caso."
  lane_a_fee_matches: "A cobrança de {amount} corresponde à tarifa vigente do seu produto ({fee_name}: {fee_amount}). Por isso não abro um caso. Se quiser, eu te encaminho para uma pessoa."

  # ---------------------------------------------------------------- lane B: case with a promised date
  lane_b_case_open: "Abri o caso {case_id}. Uma pessoa da equipe vai analisá-lo e te dar uma primeira resposta até {first_response_by}. Data estimada de resolução: {expected_date}. Abrir o caso ainda não muda a situação da cobrança: primeiro ela é analisada."

  # ---------------------------------------------------------------- lane C: a person now
  lane_c_handoff: "Seu caso {case_id} foi encaminhado para a {queue}. Uma pessoa vai entrar em contato até {first_response_by}. Deixei o resumo do que você me contou, então você não vai precisar repetir."
  lane_c_handoff_bare: "Seu caso {case_id} foi encaminhado para a {queue}. Uma pessoa vai entrar em contato até {first_response_by}."
  lane_c_priority_note: "O caso ficou com prioridade alta."
  human_request_ack: "Claro, vou te encaminhar para uma pessoa."
  compensation_ack: "Registrei seu pedido no caso. Uma pessoa vai analisá-lo; por este canal não posso confirmar pagamentos adicionais."

  # ---------------------------------------------------------------- card block (explicit yes only)
  lost_card_intro: "Sinto muito pelo seu cartão. Primeiro posso bloqueá-lo para que ninguém o use."
  block_offer: "Quer bloquear o cartão •••• {last4}? Se bloquear, não poderá voltar a usá-lo por este canal."
  block_done: "Pronto. Consultei a situação do cartão •••• {last4}: agora ele aparece como bloqueado."
  block_declined: "Entendi, não bloqueei o cartão."
  block_failed: "Não consegui confirmar o bloqueio do cartão •••• {last4}. Vou te encaminhar para uma pessoa."

  # ---------------------------------------------------------------- other intents
  case_status: "Seu caso {case_id} está na situação «{status}». Data estimada de resolução: {expected_date}."
  case_status_not_found: "Não encontrei um caso com esse número nesta conversa."
  case_status_none: "Ainda não há um caso aberto nesta conversa."
  out_of_scope: "Por este canal eu só atendo reclamações sobre cobranças, tarifas e o andamento dos seus casos, então não posso ajudar com essa solicitação. Se quiser, eu te encaminho para uma pessoa; não posso adiantar uma resposta."
  manipulation: "Só posso ajudar com reclamações sobre suas cobranças, tarifas ou casos. O que aconteceu com seu cartão ou sua conta?"

  # ---------------------------------------------------------------- session and failures
  session_expired: "Sua sessão terminou por segurança. Para continuar, comece uma nova conversa."
  session_limit: "Você chegou ao máximo de mensagens desta conversa. Para continuar, comece uma nova."
  tool_unavailable: "Não consegui consultar seus movimentos agora. Tente de novo em alguns minutos ou fale com uma pessoa."
  tool_unavailable_case: "Não consegui consultar seus movimentos agora. Abri o caso {case_id}, marcado como incompleto, e uma pessoa vai analisá-lo até {first_response_by}."
  model_slow: "Estou demorando mais do que o normal, então vou responder com opções fixas. O que você quer fazer?"

  # ---------------------------------------------------------------- buttons
  btn.start_unrecognized: "Não reconheço uma cobrança"
  btn.start_fee: "Cobraram uma tarifa indevida"
  btn.start_case_status: "Como está meu caso?"
  btn.start_lost_card: "Perdi meu cartão"
  btn.human: "Falar com uma pessoa"
  btn.confirm_charge: "É esta"
  btn.none_of_these: "Nenhuma destas"
  btn.recognize_yes: "Sim, reconheço"
  btn.recognize_no: "Não reconheço"
  btn.block_yes: "Sim, bloquear cartão •••• {last4}"
  btn.block_no: "Não"
  btn.restart: "Começar de novo"
  btn.retry: "Tentar de novo"
  btn.lang_es: "Español"
  btn.lang_pt: "Português"

  # ---------------------------------------------------------------- queues (lane C) and time zones
  # Without article (like es.yaml): lane_c_handoff says "para a {queue}"; the case card shows the label alone.
  queue.fraud: "equipe de Fraudes"
  queue.disputes: "equipe de Reclamações de cobranças"
  queue.fees: "equipe de Tarifas"
  queue.cards: "equipe de Cartões"
  queue.priority: "equipe de Atendimento prioritário"
  queue.general: "equipe de Atendimento ao cliente"
  tz.MX: "horário do centro do México"
  tz.CO: "horário da Colômbia"
  tz.AR: "horário da Argentina"
  tz.UTC: "UTC"

  # ---------------------------------------------------------------- orchestrator additions (2026-09-29)
  confirm_duplicate: "Encontrei esta cobrança {n} vezes nos seus movimentos, com minutos de diferença: {charge}. É esta?"
  ask_resolved: "Com isso ficou resolvido?"
  lane_a_closed: "Pronto. Ficou registrado como resolvido na conversa ({case_id})."
  case_status_short: "Seu caso {case_id} está na situação «{status}»."
  btn.resolved_yes: "Sim, ficou resolvido"
  btn.resolved_no: "Não, continua sem solução"
  queue.regulator: "equipe de Assuntos regulatórios"
  queue.complaints_es: "equipe de Reclamações em espanhol"
  queue.complaints_pt: "equipe de Reclamações em português"
  queue.senior: "equipe de Revisão sênior"
