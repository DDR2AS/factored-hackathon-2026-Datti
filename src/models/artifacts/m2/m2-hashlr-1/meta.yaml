# M2 artifact metadata, written by `python -m models.m2.train`; do not edit by hand.
# Trained ONLY on synthetic messages (models/m2/textgen.py). Report: docs/modelos/m2.md
model_version: m2-hashlr-1
created_by: python -m models.m2.train
synthetic_training_data: true
classes:
- dispute_charge
- dispute_fee
- complaint_other
- case_status
- account_query
- lost_card
- human_request
- out_of_scope
- manipulation
features:
  version: m2-hash-v1
  n_buckets: 32768
  char_ngrams:
  - 2
  - 5
  word_ngrams:
  - 1
  - 2
  hash: zlib.crc32 of the UTF-8 feature string; low 15 bits = bucket, top bit = sign
  concepts:
  - fee
  - charge
  - unrecognized
  - duplicate
  - overcharge
  - refund_missing
  - atm
  - card
  - loss
  - block
  - forgot
  - human
