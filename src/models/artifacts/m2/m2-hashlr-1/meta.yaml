  - chitchat
  - dollar
  - inj_override
  - inj_reveal
  - inj_internal
  - inj_role
  - inj_action
  - inj_other_customer
  - markup
  - decode
  weighting: sublinear tf (1 + ln count), L2 norm per block (characters, words, concepts)
  max_chars: 2000
  embedding_seam: features.embed(text); hashed n-grams + a concept lexicon stand in for a multilingual embedding
    model (no Bedrock embeddings available offline)
model:
  type: multinomial logistic regression (scikit-learn lbfgs, L2)
